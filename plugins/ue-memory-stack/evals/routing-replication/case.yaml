schema_version: "1.1"
name: routing-replication
tags: [routing, layer2]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    This project is at `MyGame`. Under what replication condition does `Stamina` on
    `UMGStaminaComponent` replicate, and under what condition does `bSprinting`? Answer both,
    and say where you got each answer from.
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep]
