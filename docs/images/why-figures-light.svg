  <text x="460" y="86" font-family='"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif' font-size="15" fill="#121b24" font-weight="600">less total time</text>
  <text x="460" y="110" font-family='"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif' font-size="12.5" fill="#4a5866">1.2 h against 3.6 h for the</text>
  <text x="460" y="127" font-family='"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif' font-size="12.5" fill="#4a5866">same 139 questions</text>
  <line x1="660" y1="1" x2="660" y2="155" stroke="#d7dee5"/>
  <text x="680" y="56" font-family='ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace' font-size="38" fill="#0f766a" font-weight="600">2.2×</text>
