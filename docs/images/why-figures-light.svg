<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 156" width="880" height="156" role="img" aria-label="With the stack, on 139 everyday questions: 95% correct against 68%, 0 answers outright wrong against 26, 3 times less total time, 2.2 times fewer input tokens.">
  <title>With the stack, on 139 everyday questions: 95% correct against 68%, 0 answers outright wrong against 26, 3 times less total time, 2.2 times fewer input tokens.</title>
  <rect x="0.5" y="0.5" width="879" height="155" fill="#ffffff" stroke="#d7dee5"/>
  <text x="20" y="56" font-family='ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace' font-size="38" fill="#0f766a" font-weight="600">95%</text>
