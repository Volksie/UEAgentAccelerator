<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Correctness by kind of question, without and with the memory stack. The stack scores higher in all eleven.">
  <title>Correctness by kind of question, without and with the memory stack</title>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
    .dim{fill:#59636e}
    .base{fill:#98a2ae}
    .stack{fill:#0f766a}
    .sv{fill:#0f766a;font-weight:600}
    .axis{stroke:#afb8c1}
    .grid{stroke:#d1d9e0;stroke-dasharray:2 3}
    @media (prefers-color-scheme: dark){
      .t{fill:#e6edf3}
      .dim{fill:#9198a1}
      .base{fill:#6f7a86}
      .stack{fill:#43b8a5}
      .sv{fill:#43b8a5}
      .axis{stroke:#3d444d}
      .grid{stroke:#30363d}
    }
  </style>

  <rect class="base" x="250" y="8" width="12" height="10"/>
  <text class="t dim" x="268" y="17" font-size="12">Without the stack</text>
  <rect class="stack" x="400" y="8" width="12" height="10"/>
  <text class="t dim" x="418" y="17" font-size="12">With the stack</text>

  <line class="axis" x1="250" y1="34" x2="250" y2="440"/>
  <line class="grid" x1="370" y1="34" x2="370" y2="440"/>
  <line class="grid" x1="490" y1="34" x2="490" y2="440"/>
  <line class="grid" x1="610" y1="34" x2="610" y2="440"/>
  <line class="grid" x1="730" y1="34" x2="730" y2="440"/>
  <g class="t m dim" font-size="10" text-anchor="middle">
    <text x="250" y="458">0%</text><text x="370" y="458">25%</text><text x="490" y="458">50%</text><text x="610" y="458">75%</text><text x="730" y="458">100%</text>
  </g>

  <g class="t" font-size="12">
    <text x="8" y="57">Engine API and platform support</text>
    <text x="8" y="93">Blueprint internals</text>
    <text x="8" y="129">Build, tooling and procedure</text>
    <text x="8" y="165">What makes things expensive</text>
    <text x="8" y="201">Inheritance and ancestry</text>
    <text x="8" y="237">What comments and docs say</text>
    <text x="8" y="273">Reflection and replication</text>
    <text x="8" y="309">What breaks if I change this</text>
    <text x="8" y="345">Where things are defined</text>
    <text x="8" y="381">Effective flags and writers</text>
    <text x="8" y="417">Trick questions</text>
  </g>

  <g class="base">
    <rect x="250" y="45"  width="96"    height="10"/>
    <rect x="250" y="81"  width="272.6" height="10"/>
    <rect x="250" y="117" width="248.2" height="10"/>
    <rect x="250" y="153" width="300"   height="10"/>
    <rect x="250" y="189" width="303.4" height="10"/>
    <rect x="250" y="225" width="336"   height="10"/>
    <rect x="250" y="261" width="384"   height="10"/>
    <rect x="250" y="297" width="392.6" height="10"/>
    <rect x="250" y="333" width="372"   height="10"/>
    <rect x="250" y="369" width="416.2" height="10"/>
    <rect x="250" y="405" width="456"   height="10"/>
  </g>
  <g class="stack">
    <rect x="250" y="57"  width="480"   height="10"/>
    <rect x="250" y="93"  width="480"   height="10"/>
    <rect x="250" y="129" width="456"   height="10"/>
    <rect x="250" y="165" width="450.2" height="10"/>
    <rect x="250" y="201" width="442.1" height="10"/>
    <rect x="250" y="237" width="447.8" height="10"/>
    <rect x="250" y="273" width="468"   height="10"/>
    <rect x="250" y="309" width="458.4" height="10"/>
    <rect x="250" y="345" width="432"   height="10"/>
    <rect x="250" y="381" width="447.8" height="10"/>
    <rect x="250" y="417" width="480"   height="10"/>
  </g>
  <g class="t m dim" font-size="10">
    <text x="351" y="54">20%</text>
    <text x="527.6" y="90">57%</text>
    <text x="503.2" y="126">52%</text>
    <text x="555" y="162">62%</text>
    <text x="558.4" y="198">63%</text>
    <text x="591" y="234">70%</text>
    <text x="639" y="270">80%</text>
    <text x="647.6" y="306">82%</text>
    <text x="627" y="342">78%</text>
    <text x="671.2" y="378">87%</text>
    <text x="711" y="414">95%</text>
  </g>
  <g class="t m sv" font-size="10">
    <text x="736" y="66">100%</text>
    <text x="736" y="102">100%</text>
    <text x="712" y="138">95%</text>
    <text x="706.2" y="174">94%</text>
    <text x="698.1" y="210">92%</text>
    <text x="703.8" y="246">93%</text>
    <text x="724" y="282">98%</text>
    <text x="714.4" y="318">95%</text>
    <text x="688" y="354">90%</text>
    <text x="703.8" y="390">93%</text>
    <text x="736" y="426">100%</text>
  </g>
</svg>
