<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Median seconds per question. Everyday questions: 44.1 without the stack, 27.6 with it. Harder questions: 160.8 without, 28.6 with.">
  <title>Median seconds per question, everyday against harder questions</title>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
    .dim{fill:#59636e}
    .base{fill:#98a2ae}
    .stack{fill:#0f766a}
    .sv{fill:#0f766a;font-weight:600}
    .axis{stroke:#afb8c1}
    .grid{stroke:#d1d9e0;stroke-dasharray:2 3}
    @media (prefers-color-scheme: dark){
      .t{fill:#e6edf3}
      .dim{fill:#9198a1}
      .base{fill:#6f7a86}
      .stack{fill:#43b8a5}
      .sv{fill:#43b8a5}
      .axis{stroke:#3d444d}
      .grid{stroke:#30363d}
    }
  </style>

  <rect class="base" x="200" y="8" width="12" height="10"/>
  <text class="t dim" x="218" y="17" font-size="12">Without the stack</text>
  <rect class="stack" x="350" y="8" width="12" height="10"/>
  <text class="t dim" x="368" y="17" font-size="12">With the stack</text>

  <line class="axis" x1="200" y1="34" x2="200" y2="214"/>
  <line class="grid" x1="333.3" y1="34" x2="333.3" y2="214"/>
  <line class="grid" x1="466.7" y1="34" x2="466.7" y2="214"/>
  <line class="grid" x1="600" y1="34" x2="600" y2="214"/>
  <line class="grid" x1="733.3" y1="34" x2="733.3" y2="214"/>
  <g class="t m dim" font-size="10" text-anchor="middle">
    <text x="200" y="232">0 s</text><text x="333.3" y="232">50 s</text><text x="466.7" y="232">100 s</text><text x="600" y="232">150 s</text><text x="733.3" y="232">200 s</text>
  </g>

  <text class="t" x="8" y="72" font-size="13" font-weight="600">139 everyday</text>
  <text class="t dim" x="8" y="90" font-size="11">questions</text>
  <rect class="base"  x="200" y="54"  width="117.6" height="16"/>
  <rect class="stack" x="200" y="74"  width="73.6"  height="16"/>
  <text class="t m dim" x="323.6" y="67" font-size="11">44.1 s</text>
  <text class="t m sv"  x="279.6" y="87" font-size="11">27.6 s</text>

  <text class="t" x="8" y="152" font-size="13" font-weight="600">52 harder</text>
  <text class="t dim" x="8" y="170" font-size="11">questions</text>
  <rect class="base"  x="200" y="134" width="428.8" height="16"/>
  <rect class="stack" x="200" y="154" width="76.3"  height="16"/>
  <text class="t m dim" x="634.8" y="147" font-size="11">160.8 s</text>
  <text class="t m sv"  x="282.3" y="167" font-size="11">28.6 s</text>
</svg>
